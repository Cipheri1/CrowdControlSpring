<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login – CrowdControl</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="login">
<div class="login">
<form id="form" class="painel" novalidate>
<div class="marca"><img src="img/logo.svg" alt=""><span>Crowd<b>Control</b></span></div>
<p>Entre com seu e-mail e senha.</p>
<div><label for="email">E-mail</label><input id="email" name="email" type="email" required ></div>
<div><label for="senha">Senha</label><input id="senha" name="senha" type="password" required ></div>
<p id="msg" class="erro" role="alert"></p>
<button class="p" type="submit">Entrar</button>
<p><small>Para testar: admin@crowdcontrol.com / admin123</small></p>
</form>
</div>
<script src="js/validacao.js"></script>
<script src="js/app.js"></script>
</body>
</html>
