<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuários – CrowdControl</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="usuarios">
<div class="app"><aside id="menu"></aside>
<main>
<div class="topo"><h2>Usuários</h2><span id="ola"></span></div>
<div class="painel tabela"><table><thead id="cab"></thead><tbody id="corpo"></tbody></table></div>
<form id="form" class="painel" novalidate>
<h3>Novo usuário / editar usuário</h3>
<div class="grade">
<div><label for="nome">Nome</label><input id="nome" name="nome" type="text" required ></div>
<div><label for="email">E-mail</label><input id="email" name="email" type="email" required ></div>
<div><label for="senha">Senha</label><input id="senha" name="senha" type="password" required minlength="3"></div>
<div><label for="cargo">Cargo</label><input id="cargo" name="cargo" type="text" ></div>
<div><label for="status">Status</label><select id="status" name="status" required><option>Ativo</option><option>Inativo</option></select></div>
</div>
<p id="msg" role="status"></p>
<button class="p" type="submit">Salvar</button> <button type="button" id="cancelar">Cancelar</button>
</form>
</main></div>
<script src="js/validacao.js"></script>
<script src="js/app.js"></script>
</body>
</html>
