<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chamados – CrowdControl</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="chamados">
<div class="app"><aside id="menu"></aside>
<main>
<div class="topo"><h2>Chamados</h2><span id="ola"></span></div>
<div id="filtros" class="filtros"></div>
<div class="painel tabela"><table><thead id="cab"></thead><tbody id="corpo"></tbody></table></div>
<form id="form" class="painel" novalidate>
<h3>Novo chamado / editar chamado</h3>
<div class="grade">
<div><label for="titulo">Título</label><input id="titulo" name="titulo" type="text" required minlength="3"></div>
<div><label for="solicitante">Solicitante</label><input id="solicitante" name="solicitante" type="text" required ></div>
<div><label for="categoria">Categoria</label><select id="categoria" name="categoria" required><option>Hardware</option><option>Sistema</option><option>Rede</option><option>TI</option></select></div>
<div><label for="prioridade">Prioridade</label><select id="prioridade" name="prioridade" required><option>Baixa</option><option>Média</option><option>Alta</option><option>Crítica</option></select></div>
<div><label for="status">Status</label><select id="status" name="status" required><option>Aberto</option><option>Em andamento</option><option>Resolvido</option></select></div>
<div style="grid-column:1/-1"><label for="descricao">Descrição</label><textarea id="descricao" name="descricao" rows="2"></textarea></div>
</div>
<p id="msg" role="status"></p>
<button class="p" type="submit">Salvar</button> <button type="button" id="cancelar">Cancelar</button>
</form>
</main></div>
<script src="js/validacao.js"></script>
<script src="js/app.js"></script>
</body>
</html>
