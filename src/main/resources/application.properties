server.port=8080

# Dados do banco. Os valores padrão abaixo valem para um MySQL local.
# Para colocar a sua senha SEM mandá-la ao GitHub, crie o arquivo config/application.properties
# (essa pasta está no .gitignore) com a linha: crowdcontrol.db.password=SUA_SENHA
crowdcontrol.db.url=${DB_URL:jdbc:mysql://localhost:3306/crowdcontrol_db}
crowdcontrol.db.user=${DB_USER:root}
crowdcontrol.db.password=${DB_PASSWORD:}
